<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>رصيد الإجازات | العجمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #5B9F8A;
      --teal-light: #7BB8A6;
      --teal-dark: #28443B;
      --orange: #F2A453;
      --bg: #0A1210;
      --card: #12201C;
      --card-hover: #1A2F2A;
      --text: #FFFFFF;
      --muted: #A8C5BB;
      --success: #4ADE80;
      --warning: #FBBF24;
      --danger: #F87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(91,159,138,0.14) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 100%, rgba(242,164,83,0.07) 0%, transparent 40%);
    }

    .header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(10,18,16,0.94);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(91,159,138,0.22);
      padding: 14px 18px;
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
    }
    .logo-side {
      display: flex; align-items: center; gap: 14px;
    }
    .logo-side img {
      height: 54px; width: auto;
      filter: drop-shadow(0 3px 10px rgba(91,159,138,0.35));
    }
    .header-text h1 {
      font-size: 1.35rem; font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--teal-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-text p { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

    .emp-count {
      text-align: center;
      background: rgba(91,159,138,0.12);
      border: 1px solid rgba(91,159,138,0.28);
      border-radius: 14px;
      padding: 8px 16px;
      min-width: 72px;
    }
    .emp-count .num {
      font-size: 1.5rem; font-weight: 800; color: var(--teal);
      font-variant-numeric: lining-nums; line-height: 1;
    }
    .emp-count .lbl {
      font-size: 0.75rem; color: var(--muted); margin-top: 3px;
    }

    .filters {
      max-width: 1200px; margin: 18px auto 0; padding: 0 16px;
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    }
    .filter-btn {
      padding: 10px 22px;
      border-radius: 50px;
      border: 1px solid rgba(91,159,138,0.32);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .filter-btn:hover {
      border-color: var(--teal);
      color: var(--teal-light);
    }
    .filter-btn.active {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
      box-shadow: 0 4px 16px rgba(91,159,138,0.4);
    }

    .container {
      max-width: 1200px; margin: 0 auto;
      padding: 20px 16px 55px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      border: 1.5px solid rgba(255,255,255,0.18);
      overflow: hidden;
      transition: 0.28s ease;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35), 0 1px 4px rgba(255,255,255,0.04);
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(255,255,255,0.32);
      background: var(--card-hover);
      box-shadow: 0 12px 36px rgba(0,0,0,0.45), 0 0 20px rgba(91,159,138,0.12);
    }

    .card-top {
      padding: 18px 18px 12px;
      display: flex; align-items: flex-start; gap: 14px;
    }

    .avatar {
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; font-weight: 800; color: #fff; flex-shrink: 0;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.15);
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .info { flex: 1; min-width: 0; }
    .info h3 {
      font-size: 1.12rem; font-weight: 700;
      line-height: 1.35; margin-bottom: 4px;
      word-break: break-word;
    }
    .info .dept {
      font-size: 1rem;
      font-weight: 700;
      color: var(--teal-light);
      margin-bottom: 6px;
    }
    .info .phone {
      font-size: 0.9rem;
      color: var(--teal-light);
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px;
      direction: ltr;
      transition: color 0.2s;
    }
    .info .phone:hover { color: var(--orange); }
    .info .phone.empty { color: var(--muted); opacity: 0.7; }

    .card-body { padding: 4px 18px 18px; }

    .balance-box {
      background: rgba(91,159,138,0.09);
      border: 1px solid rgba(91,159,138,0.16);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      margin-bottom: 14px;
    }
    .balance-label {
      font-size: 0.8rem; color: var(--muted);
      font-weight: 600; margin-bottom: 5px;
    }
    .balance-num {
      font-size: 2.5rem; font-weight: 800; line-height: 1;
      font-variant-numeric: lining-nums;
    }
    .balance-num.high { color: var(--success); }
    .balance-num.medium { color: var(--warning); }
    .balance-num.low { color: var(--danger); }
    .balance-unit {
      font-size: 0.9rem; color: var(--muted); margin-top: 4px;
    }
    .bar {
      height: 6px; background: rgba(255,255,255,0.08);
      border-radius: 8px; margin-top: 12px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 8px; transition: width 0.6s;
    }
    .bar-fill.high { background: linear-gradient(90deg, #22C55E, #4ADE80); }
    .bar-fill.medium { background: linear-gradient(90deg, #F59E0B, #FBBF24); }
    .bar-fill.low { background: linear-gradient(90deg, #EF4444, #F87171); }

    .meta {
      display: flex; gap: 10px;
    }
    .meta-item {
      flex: 1;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 11px 8px;
      text-align: center;
    }
    .meta-item .lbl {
      font-size: 0.75rem; color: var(--muted); margin-bottom: 3px;
    }
    .meta-item .val {
      font-size: 0.95rem; font-weight: 700; color: #FFFFFF;
      font-variant-numeric: lining-nums;
      word-break: break-word;
    }

    .state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .state h3 { color: var(--text); font-size: 1.2rem; margin-bottom: 6px; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(91,159,138,0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 0.82rem;
      color: var(--muted);
      border-top: 1px solid rgba(91,159,138,0.15);
    }
    .footer b { color: var(--teal); }

    @media (max-width: 600px) {
      .header { padding: 12px 14px; }
      .logo-side img { height: 46px; }
      .header-text h1 { font-size: 1.15rem; }
      .header-text p { font-size: 0.75rem; }
      .emp-count { padding: 7px 12px; }
      .emp-count .num { font-size: 1.3rem; }
      .emp-count .lbl { font-size: 0.7rem; }
      .filters { padding: 0 12px; gap: 8px; margin-top: 14px; }
      .filter-btn { padding: 10px 12px; font-size: 0.88rem; flex: 1; text-align: center; }
      .container { padding: 16px 12px 45px; }
      .cards { grid-template-columns: 1fr; gap: 16px; }
      .card { border-radius: 16px; border: 1.5px solid rgba(255,255,255,0.2); box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
      .card-top { padding: 16px 16px 10px; gap: 12px; }
      .avatar { width: 54px; height: 54px; font-size: 1.2rem; }
      .info h3 { font-size: 1.15rem; }
      .info .dept { font-size: 1.02rem; }
      .info .phone { font-size: 0.92rem; }
      .card-body { padding: 2px 16px 16px; }
      .balance-box { padding: 15px; margin-bottom: 12px; }
      .balance-label { font-size: 0.82rem; }
      .balance-num { font-size: 2.4rem; }
      .balance-unit { font-size: 0.92rem; }
      .meta { gap: 8px; }
      .meta-item { padding: 12px 8px; border-radius: 11px; }
      .meta-item .lbl { font-size: 0.78rem; }
      .meta-item .val { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo-side">
        <img src="logo-alajamy.png" alt="Alajamy" onerror="this.style.display='none'">
        <div class="header-text">
          <h1>رصيد الإجازات</h1>
          <p>العجمي • Since 1989</p>
        </div>
      </div>
      <div class="emp-count">
        <div class="num" id="empCount">0</div>
        <div class="lbl">موظف</div>
      </div>
    </div>
  </header>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-dept="all">الكل</button>
    <button class="filter-btn" data-dept="ASYA">ASYA</button>
    <button class="filter-btn" data-dept="AJM">AJM</button>
    <button class="filter-btn" data-dept="JAMAL">JAMAL</button>
  </div>

  <main class="container">
    <div class="cards" id="cards">
      <div class="state">
        <div class="spinner"></div>
        <h3>جاري التحميل...</h3>
      </div>
    </div>
  </main>

  <footer class="footer">
    © <b>العجمي Alajamy</b> • Since 1989
  </footer>

<script>
  const SHEET_ID = '1ZRGJwwoBHzbU2UdTz3Ws-D2XBbFlvGrHl-cqUoI3I1Q';
  const REFRESH_SEC = 60;

  let allEmployees = [];
  let currentDept = 'all';

  function level(b) {
    if (b >= 10) return 'high';
    if (b >= 5) return 'medium';
    return 'low';
  }

  function initials(name) {
    const p = name.trim().split(/\s+/);
    if (p.length >= 2) return (p[0][0] + p[1][0]).toUpperCase();
    return name.substring(0, 2).toUpperCase();
  }

  function toLatin(n) {
    return String(n).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  }

  function formatDate(val) {
    if (!val || val === '' || val === '—') return '—';
    if (!isNaN(val) && Number(val) > 30000) {
      const d = new Date(Date.UTC(1899, 11, 30) + Number(val) * 86400000);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return toLatin(d.getUTCDate().toString().padStart(2,'0') + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear());
    }
    if (isNaN(Date.parse(val))) return val;
    const d = new Date(val);
    if (isNaN(d)) return val;
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return toLatin(d.getDate().toString().padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear());
  }

  // Convert Google Drive links to a more reliable direct image URL
  function fixPhotoUrl(url) {
    if (!url) return '';
    url = url.trim();

    // Extract file ID from various Google Drive URL formats
    let id = null;
    const patterns = [
      /\/file\/d\/([a-zA-Z0-9_-]+)/,
      /id=([a-zA-Z0-9_-]+)/,
      /\/d\/([a-zA-Z0-9_-]+)/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) { id = m[1]; break; }
    }

    if (id) {
      // Use thumbnail endpoint - more reliable for embedding
      return `https://drive.google.com/thumbnail?id=${id}&sz=w200`;
    }
    return url;
  }

  function render(list) {
    const el = document.getElementById('cards');
    document.getElementById('empCount').textContent = toLatin(list.length);

    if (!list.length) {
      el.innerHTML = '<div class="state"><h3>لا يوجد موظفين في هذا القسم</h3></div>';
      return;
    }

    el.innerHTML = list.map(e => {
      const lv = level(e.balance);
      const pct = Math.min(100, Math.max(5, (e.balance / 20) * 100));
      const photoUrl = fixPhotoUrl(e.photo);

      let avatarHtml = '';
      if (photoUrl) {
        avatarHtml = `<div class="avatar"><img src="${photoUrl}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${initials(e.name)}'"></div>`;
      } else {
        avatarHtml = `<div class="avatar">${initials(e.name)}</div>`;
      }

      let phoneHtml = '';
      if (e.phone && e.phone.trim() !== '') {
        const clean = e.phone.replace(/\s+/g, '');
        phoneHtml = `<a class="phone" href="tel:${clean}">📞 ${toLatin(e.phone)}</a>`;
      } else {
        phoneHtml = `<span class="phone empty">📞 —</span>`;
      }

      return `
        <article class="card">
          <div class="card-top">
            ${avatarHtml}
            <div class="info">
              <h3>${e.name}</h3>
              <div class="dept">${e.dept || '—'}</div>
              ${phoneHtml}
            </div>
          </div>
          <div class="card-body">
            <div class="balance-box">
              <div class="balance-label">الرصيد المتبقي</div>
              <div class="balance-num ${lv}">${toLatin(e.balance)}</div>
              <div class="balance-unit">يوم</div>
              <div class="bar"><div class="bar-fill ${lv}" style="width:${pct}%"></div></div>
            </div>
            <div class="meta">
              <div class="meta-item">
                <div class="lbl">أيام مأخوذة</div>
                <div class="val">${toLatin(e.taken)}</div>
              </div>
              <div class="meta-item">
                <div class="lbl">آخر إجازة</div>
                <div class="val">${formatDate(e.lastLeave)}</div>
              </div>
            </div>
          </div>
        </article>`;
    }).join('');
  }

  function applyFilter() {
    if (currentDept === 'all') {
      render(allEmployees);
    } else {
      render(allEmployees.filter(e => e.dept.toUpperCase() === currentDept));
    }
  }

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    const out = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = [];
      let cur = '', inQ = false;
      for (let c of lines[i]) {
        if (c === '"') { inQ = !inQ; continue; }
        if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
        cur += c;
      }
      cols.push(cur.trim());
      if (!cols[0]) continue;

      out.push({
        name: cols[0] || '—',
        phone: cols[1] || '',
        balance: parseFloat(cols[2]) || 0,
        taken: parseFloat(cols[3]) || 0,
        lastLeave: cols[4] || '—',
        dept: (cols[5] || '').trim(),
        photo: (cols[8] || '').trim()
      });
    }
    return out;
  }

  async function load() {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&t=${Date.now()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('network');
      const text = await res.text();
      if (text.includes('<html') || text.includes('<!DOCTYPE')) throw new Error('private');
      allEmployees = parseCSV(text);
      applyFilter();
    } catch (err) {
      document.getElementById('cards').innerHTML = `
        <div class="state">
          <h3>تعذر تحميل البيانات</h3>
          <p style="margin-top:8px;font-size:0.9rem;line-height:1.6">
            تأكد أن الشيت<br>Anyone with the link<br>
            وافتح الصفحة عبر Live Server
          </p>
        </div>`;
    }
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDept = btn.dataset.dept;
      applyFilter();
    });
  });

  load();
  setInterval(load, REFRESH_SEC * 1000);
</script>
</body>
</html>
