<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>رصيد الإجازات | العجمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #5B9F8A;
      --teal-light: #7BB8A6;
      --teal-dark: #28443B;
      --orange: #F2A453;
      --bg: #0A1210;
      --card: #12201C;
      --card-hover: #1A2F2A;
      --text: #FFFFFF;
      --muted: #A8C5BB;
      --success: #4ADE80;
      --warning: #FBBF24;
      --danger: #F87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(91,159,138,0.14) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 100%, rgba(242,164,83,0.07) 0%, transparent 40%);
    }

    .header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(10,18,16,0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(91,159,138,0.22);
      padding: 14px 18px;
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; gap: 14px;
    }
    .header-inner img {
      height: 52px; width: auto;
      filter: drop-shadow(0 3px 10px rgba(91,159,138,0.35));
    }
    .header-text h1 {
      font-size: 1.25rem; font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--teal-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-text p { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }

    .container {
      max-width: 1200px; margin: 0 auto;
      padding: 20px 16px 50px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      border: 1px solid rgba(91,159,138,0.18);
      overflow: hidden;
      transition: 0.28s ease;
      box-shadow: 0 8px 28px rgba(0,0,0,0.32);
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: var(--teal);
      background: var(--card-hover);
    }

    .card-top {
      padding: 16px 16px 10px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 13px;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .info { flex: 1; min-width: 0; }
    .info h3 {
      font-size: 1rem; font-weight: 700;
      line-height: 1.3; margin-bottom: 4px;
      word-break: break-word;
    }
    .info .dept {
      font-size: 0.75rem; color: var(--muted);
      margin-bottom: 6px;
    }

    /* Contact links */
    .contact {
      display: flex; flex-direction: column; gap: 3px;
    }
    .contact a {
      font-size: 0.8rem;
      color: var(--teal-light);
      text-decoration: none;
      display: flex; align-items: center; gap: 5px;
      transition: color 0.2s;
      direction: ltr;
      text-align: right;
      justify-content: flex-end;
    }
    .contact a:hover { color: var(--orange); }
    .contact .empty {
      font-size: 0.78rem; color: var(--muted); opacity: 0.7;
    }

    .card-body { padding: 4px 16px 16px; }

    .balance-box {
      background: rgba(91,159,138,0.08);
      border: 1px solid rgba(91,159,138,0.14);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      margin-bottom: 12px;
    }
    .balance-label {
      font-size: 0.72rem; color: var(--muted);
      font-weight: 600; margin-bottom: 4px;
    }
    .balance-num {
      font-size: 2.3rem; font-weight: 800; line-height: 1;
      font-variant-numeric: lining-nums;
    }
    .balance-num.high { color: var(--success); }
    .balance-num.medium { color: var(--warning); }
    .balance-num.low { color: var(--danger); }
    .balance-unit {
      font-size: 0.82rem; color: var(--muted); margin-top: 3px;
    }
    .bar {
      height: 5px; background: rgba(255,255,255,0.07);
      border-radius: 8px; margin-top: 11px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 8px; transition: width 0.6s;
    }
    .bar-fill.high { background: linear-gradient(90deg, #22C55E, #4ADE80); }
    .bar-fill.medium { background: linear-gradient(90deg, #F59E0B, #FBBF24); }
    .bar-fill.low { background: linear-gradient(90deg, #EF4444, #F87171); }

    .meta {
      display: flex; gap: 8px;
    }
    .meta-item {
      flex: 1;
      background: rgba(0,0,0,0.22);
      border-radius: 10px;
      padding: 9px 6px;
      text-align: center;
    }
    .meta-item .lbl {
      font-size: 0.68rem; color: var(--muted); margin-bottom: 2px;
    }
    .meta-item .val {
      font-size: 0.85rem; font-weight: 700; color: var(--teal-light);
      font-variant-numeric: lining-nums;
      word-break: break-word;
    }

    .state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .state h3 { color: var(--text); font-size: 1.15rem; margin-bottom: 6px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(91,159,138,0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      text-align: center;
      padding: 18px;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid rgba(91,159,138,0.15);
    }
    .footer b { color: var(--teal); }

    @media (max-width: 600px) {
      .header { padding: 12px 14px; }
      .header-inner img { height: 44px; }
      .header-text h1 { font-size: 1.1rem; }
      .container { padding: 16px 12px 40px; }
      .cards { grid-template-columns: 1fr; gap: 14px; }
      .balance-num { font-size: 2.1rem; }
      .card-top { padding: 14px 14px 8px; }
      .card-body { padding: 2px 14px 14px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <img src="logo-alajamy.png" alt="Alajamy" onerror="this.style.display='none'">
      <div class="header-text">
        <h1>رصيد الإجازات</h1>
        <p>العجمي • Since 1989</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="cards" id="cards">
      <div class="state">
        <div class="spinner"></div>
        <h3>جاري التحميل...</h3>
      </div>
    </div>
  </main>

  <footer class="footer">
    © <b>العجمي Alajamy</b> • Since 1989
  </footer>

<script>
  const SHEET_ID = '1ZRGJwwoBHzbU2UdTz3Ws-D2XBbFlvGrHl-cqUoI3I1Q';
  const REFRESH_SEC = 60;

  function level(b) {
    if (b >= 10) return 'high';
    if (b >= 5) return 'medium';
    return 'low';
  }

  function initials(name) {
    const p = name.trim().split(/\s+/);
    if (p.length >= 2) return (p[0][0] + p[1][0]).toUpperCase();
    return name.substring(0, 2).toUpperCase();
  }

  function toLatin(n) {
    return String(n).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  }

  function formatDate(val) {
    if (!val || val === '' || val === '—') return '—';
    if (!isNaN(val) && Number(val) > 30000) {
      const d = new Date(Date.UTC(1899, 11, 30) + Number(val) * 86400000);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return toLatin(d.getUTCDate().toString().padStart(2,'0') + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear());
    }
    if (isNaN(Date.parse(val))) return val;
    const d = new Date(val);
    if (isNaN(d)) return val;
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return toLatin(d.getDate().toString().padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear());
  }

  function render(list) {
    const el = document.getElementById('cards');
    if (!list.length) {
      el.innerHTML = '<div class="state"><h3>لا يوجد موظفين</h3></div>';
      return;
    }
    el.innerHTML = list.map(e => {
      const lv = level(e.balance);
      const pct = Math.min(100, Math.max(5, (e.balance / 20) * 100));

      // Phone
      let phoneHtml = '';
      if (e.phone && e.phone !== '—' && e.phone.trim() !== '') {
        const cleanPhone = e.phone.replace(/\s+/g, '');
        phoneHtml = `<a href="tel:${cleanPhone}">📞 ${toLatin(e.phone)}</a>`;
      } else {
        phoneHtml = `<span class="empty">📞 —</span>`;
      }

      // Email
      let emailHtml = '';
      if (e.email && e.email !== '—' && e.email.trim() !== '') {
        emailHtml = `<a href="mailto:${e.email}">✉️ ${e.email}</a>`;
      } else {
        emailHtml = `<span class="empty">✉️ —</span>`;
      }

      return `
        <article class="card">
          <div class="card-top">
            <div class="avatar">${initials(e.name)}</div>
            <div class="info">
              <h3>${e.name}</h3>
              <div class="dept">${e.dept || '—'}</div>
              <div class="contact">
                ${phoneHtml}
                ${emailHtml}
              </div>
            </div>
          </div>
          <div class="card-body">
            <div class="balance-box">
              <div class="balance-label">الرصيد المتبقي</div>
              <div class="balance-num ${lv}">${toLatin(e.balance)}</div>
              <div class="balance-unit">يوم</div>
              <div class="bar"><div class="bar-fill ${lv}" style="width:${pct}%"></div></div>
            </div>
            <div class="meta">
              <div class="meta-item">
                <div class="lbl">أيام مأخوذة</div>
                <div class="val">${toLatin(e.taken)}</div>
              </div>
              <div class="meta-item">
                <div class="lbl">آخر إجازة</div>
                <div class="val">${formatDate(e.lastLeave)}</div>
              </div>
            </div>
          </div>
        </article>`;
    }).join('');
  }

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    const out = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = [];
      let cur = '', inQ = false;
      for (let c of lines[i]) {
        if (c === '"') { inQ = !inQ; continue; }
        if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
        cur += c;
      }
      cols.push(cur.trim());
      if (!cols[0]) continue;

      // Current sheet columns:
      // 0: اسم | 1: هاتف | 2: رصيد | 3: مأخوذة | 4: آخر إجازة | 5: قسم | 6: تاريخ تعيين | 7: رصيد ابتدائي
      // If you add Email later, put it in column I (index 8)
      out.push({
        name: cols[0] || '—',
        phone: cols[1] || '',
        balance: parseFloat(cols[2]) || 0,
        taken: parseFloat(cols[3]) || 0,
        lastLeave: cols[4] || '—',
        dept: cols[5] || '',
        email: cols[8] || cols[7] || ''   // tries column I first, then H as fallback
      });
    }
    return out;
  }

  async function load() {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&t=${Date.now()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('network');
      const text = await res.text();
      if (text.includes('<html') || text.includes('<!DOCTYPE')) throw new Error('private');
      render(parseCSV(text));
    } catch (err) {
      document.getElementById('cards').innerHTML = `
        <div class="state">
          <h3>تعذر تحميل البيانات</h3>
          <p style="margin-top:8px;font-size:0.9rem;line-height:1.6">
            تأكد أن الشيت<br>Anyone with the link<br>
            وافتح الصفحة عبر Live Server
          </p>
        </div>`;
    }
  }

  load();
  setInterval(load, REFRESH_SEC * 1000);
</script>
</body>
</html>
